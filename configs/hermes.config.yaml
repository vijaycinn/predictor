    timeout: 120
    connect_timeout: 60
  agentmail:
    command: npx
    args:
    - -y
    - agentmail-mcp
    env:
      AGENTMAIL_API_KEY: am_us_0d7a964e87260ed66071f672fd67096fa6c7af555e4642f3f591d220d8633f15
  investor-agent:
    command: node
    args:
    - /data/workspace/investor-agent/dist/index.js
