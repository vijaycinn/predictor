# Predictor — prediction market trading agent config
venue: kalshi              # live-capable venue (Kalshi keys in env, internal wallet)
kalshi:
  base_url: https://external-api.kalshi.com/trade-api/v2
  # credentials come from env: KALSHI_API_KEY (key ID) + KALSHI_PRIVATE_KEY (RSA PEM)
  scan:
    # Kalshi volumes ~10x smaller than Polymarket; relax gates
    min_volume_usd: 2000
    min_24h_volume: 300
    min_liquidity: 100

mode: live                # LIVE — real money. venue must be kalshi

scan:
  max_markets: 40          # markets evaluated per scan
  categories: [crypto, politics, sports, economics]
  min_volume_usd: 50000    # total market volume gate
  min_24h_volume: 5000     # recent activity gate (approx via liquidity/trades)
  min_liquidity: 1000      # gamma liquidity field gate
  min_recent_trades: 5     # trades in last window to consider market active

fees:
  taker_fee_per_share: 0.0   # Polymarket currently 0; set when venue changes
  maker_fee_per_share: 0.0
  gas_per_trade_usd: 0.0

execution:
  order_ttl_hours: 1            # DEFAULT order TTL = 1h (VJ 2026-08-02) — stale resting orders are dead weight; VJ explicit instruction overrides
  max_spread: 0.04           # skip markets wider than this
  min_hours_to_expiry: 2
  max_days_to_expiry: 400    # politics/econ run long-dated
  min_edge: 0.03             # min |estimated_prob - price| to act (3 cents)
  ev_min_net: 0.02           # min EV_net per share after fees/slippage
  prefer_maker: true         # rest limit orders when possible
  maker_depth_cents: 2       # rest >=2c below ref price (VJ 2026-08-02)
  maker_min_volume: 100      # min contracts at chosen maker level
  max_price_raise_pct: 10   # HARD (VJ 2026-08-02): NEVER pay >10% above approved price. Below always OK (maker).
  wall_tolerance_cents: 2    # HARD (VJ 2026-08-05): limit may not rest more than 2c ABOVE full-ladder vol-weighted wall (Ribecai lesson: 0.76 bid vs 0.65 wall = overpay)
  max_buy_price_cents: 40    # HARD BAND (VJ 2026-08-02): never buy YES above 40c unless explicit override
  min_win_prob: 0.50         # HARD (VJ 2026-08-02): NEVER bet if outcome prob <50%. Prob must come from independent source (Polymarket arb or verifiable research), not Kalshi book alone.
  aggressiveness: 0.5        # 0 = best price only, 1 = cross spread aggressively
  stop_loss: false           # NO STOP-LOSS (VJ): high-risk/high-reward events

risk:
  capital_usd: 1000
  max_trade_usd: 1.0        # LIVE cap: $1 per trade (VJ set 2026-08-01)
  margin_trading: false     # NO MARGIN TRADING EVER — code asserts this stays false (all modes)
  max_open_positions: 16    # raised 2026-08-02: 7 book + 8 tennis underdog + headroom
  max_per_trade_frac: 0.20
  max_notional_frac: 0.60
  max_daily_loss_usd: 50
  max_per_event_frac: 0.30
  kelly_fraction: 0.25
  max_concurrent_positions: 12
  max_same_category_frac: 0.40

prob:
  market_price_weight: 0.55
  orderbook_weight: 0.15
  momentum_weight: 0.10
  base_rate_weight: 0.05
  sentiment_weight: 0.05
  llm_weight: 0.30        # applied only when an LLM override exists; else redistributed to market
  shortlist_edge: 0.008   # |edge| bar for LLM review shortlist
  shortlist_max: 10       # cap on shortlist size
  momentum_lookback: 24      # points from price history
  momentum_scale: 0.10       # max prob shift from momentum
  book_imbalance_scale: 0.03 # max prob shift from orderbook imbalance
  min_prob: 0.01
  max_prob: 0.99

learn:
  calibration_buckets: 10    # decile buckets for calibration report
  min_samples_per_bucket: 5

approval:
  required: true             # LIVE ONLY: every real buy needs explicit user approval
  ttl_hours: 2               # proposals expire after this; rescan regenerates
  recheck_on_approve: true   # re-verify EV/liquidity before executing approved trade
